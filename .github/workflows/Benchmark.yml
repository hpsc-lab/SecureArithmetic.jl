name: Benchmark

on:
  pull_request:
    paths:
      - 'src/linear_algebra.jl'
      - 'src/arithmetic.jl'
  workflow_dispatch:

permissions:
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ startsWith(github.ref, 'refs/pull/') }}

jobs:
  benchmark:
    name: Run benchmarks
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout SecureArithmetic.jl
        uses: actions/checkout@v7
        with:
          path: SecureArithmetic.jl

      - name: Checkout SecureArithmeticBenchmarks.jl
        uses: actions/checkout@v7
        with:
          repository: Tom-Finke/SecureArithmeticBenchmarks.jl
          path: SecureArithmeticBenchmarks.jl

      - name: Set up Julia
        uses: julia-actions/setup-julia@v3
        with:
          version: '1.12'

      - name: Cache Julia packages
        uses: julia-actions/cache@v2
        with:
          cache-name: benchmark

      - name: Run benchmarks
        id: benchmark
        env:
          OMP_NUM_THREADS: 1
        run: |
          set +e
          julia --project=SecureArithmeticBenchmarks.jl \
            SecureArithmeticBenchmarks.jl/run.jl \
            --secure-arithmetic-path "${{ github.workspace }}/SecureArithmetic.jl" \
            --csv results.csv
          echo "status=$?" >> "$GITHUB_OUTPUT"

      - name: Generate report
        if: always() && steps.benchmark.outputs.status != ''
        run: |
          bash SecureArithmetic.jl/.github/scripts/benchmark-report.sh \
            results.csv \
            "${{ steps.benchmark.outputs.status }}" \
            > report.md
          cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Find existing comment
        if: github.event_name == 'pull_request'
        uses: peter-evans/find-comment@v3
        id: find-comment
        with:
          issue-number: ${{ github.event.number }}
          comment-author: 'github-actions[bot]'
          body-includes: '<!-- benchmark-results -->'

      - name: Comment on PR
        if: github.event_name == 'pull_request'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.number }}
          comment-id: ${{ steps.find-comment.outputs.comment-id }}
          body-path: report.md
          edit-mode: replace

      - name: Fail on benchmark error
        if: steps.benchmark.outputs.status != '0'
        run: exit 1
